customCommands:
  # Generate an editable Conventional Commit subject from staged changes
  - key: 'G'
    context: 'files'
    description: 'Generate AI commit message'
    prompts:
      - type: 'menu'
        key: 'Type'
        title: 'Type of change'
        options:
          - name: 'auto'
            description: 'Let Pi choose the type'
            value: 'auto'
            key: 'a'
          - name: 'feat'
            description: 'A new feature'
            value: 'feat'
            key: 'f'
          - name: 'fix'
            description: 'A bug fix'
            value: 'fix'
            key: 'x'
          - name: 'refactor'
            description: 'Code restructuring without a behavior change'
            value: 'refactor'
            key: 'r'
          - name: 'perf'
            description: 'A performance improvement'
            value: 'perf'
            key: 'p'
          - name: 'test'
            description: 'Add or update tests'
            value: 'test'
            key: 't'
          - name: 'docs'
            description: 'Documentation only'
            value: 'docs'
            key: 'd'
          - name: 'build'
            description: 'Build system or dependency changes'
            value: 'build'
            key: 'b'
          - name: 'ci'
            description: 'CI configuration or scripts'
            value: 'ci'
            key: 'i'
          - name: 'chore'
            description: 'Maintenance or tooling changes'
            value: 'chore'
            key: 'c'
          - name: 'style'
            description: 'Formatting without a behavior change'
            value: 'style'
            key: 's'
          - name: 'revert'
            description: 'Revert an earlier change'
            value: 'revert'
            key: 'v'
      - type: 'input'
        key: 'Message'
        title: 'Commit message (edit or press Enter)'
        initialValue: '{{ runCommand (printf "lazygit-ai-commit %s" .Form.Type) }}'
    command: 'git commit -m {{ .Form.Message | quote }}'
    loadingText: 'Committing'
  # Create worktree from current branch (when in worktrees view)
  - key: 'N'
    context: 'worktrees'
    description: 'Create new worktree from current branch'
    prompts:
      - type: 'input'
        title: 'Create a new worktree from {{ .CheckedOutBranch.Name }} with what name?'
        key: 'Name'
        initialValue: ''
    command: 'git worktree add ../{{ .Form.Name }} {{ .CheckedOutBranch.Name }} -b {{ .Form.Name }}'
  # Create worktree from selected branch (when in branches view)
  - key: 'N'
    context: 'localBranches'
    description: 'Create new worktree from selected branch'
    prompts:
      - type: 'input'
        title: 'Create a new worktree from {{ .SelectedLocalBranch.Name }} with what name?'
        key: 'Name'
        initialValue: ''
    command: 'git worktree add ../{{ .Form.Name }} {{ .SelectedLocalBranch.Name }} -b {{ .Form.Name }}'
  # Open cmux workspace for selected worktree (when in worktrees view)
  - key: 'O'
    context: 'worktrees'
    description: 'Open selected worktree in cmux'
    command: 'cmux-worktree path {{ .SelectedWorktree.Path | quote }}'
  # Open cmux workspace for selected branch's worktree (when in branches view)
  - key: 'O'
    context: 'localBranches'
    description: 'Open selected branch worktree in cmux'
    command: 'cmux-worktree branch {{ .SelectedLocalBranch.Name | quote }}'
  # Open cmux workspace for current worktree (when in files view)
  - key: 'O'
    context: 'files'
    description: 'Open current worktree in cmux'
    command: 'cmux-worktree path "$(git rev-parse --show-toplevel)"'
  # Open Herdr workspace for selected worktree (when in worktrees view)
  - key: 'H'
    context: 'worktrees'
    description: 'Open selected worktree in Herdr'
    command: 'herdr-worktree path {{ .SelectedWorktree.Path | quote }}'
  # Open Herdr workspace for selected branch's worktree (when in branches view)
  - key: 'H'
    context: 'localBranches'
    description: 'Open selected branch worktree in Herdr'
    command: 'herdr-worktree branch {{ .SelectedLocalBranch.Name | quote }}'
  # Open Herdr workspace for current worktree (when in files view)
  - key: 'H'
    context: 'files'
    description: 'Open current worktree in Herdr'
    command: 'herdr-worktree path "$(git rev-parse --show-toplevel)"'
  # Open Zellij tab for selected worktree (when in worktrees view)
  - key: 'Z'
    context: 'worktrees'
    description: 'Open selected worktree in Zellij'
    command: 'zellij-worktree path {{ .SelectedWorktree.Path | quote }}'
  # Open Zellij tab for selected branch's worktree (when in branches view)
  - key: 'Z'
    context: 'localBranches'
    description: 'Open selected branch worktree in Zellij'
    command: 'zellij-worktree branch {{ .SelectedLocalBranch.Name | quote }}'
  # Open Zellij tab for current worktree (when in files view)
  - key: 'Z'
    context: 'files'
    description: 'Open current worktree in Zellij'
    command: 'zellij-worktree path "$(git rev-parse --show-toplevel)"'
os:
  # Override `nvim-remote` default behavior of opening files to edit in a new nvim tab, just open as a buffer
  editPreset: 'nvim-remote'
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'
gui:
  nerdFontsVersion: '3'
  showFileIcons: true
  theme:
    activeBorderColor:
      - '#E6B450'
      - bold
    inactiveBorderColor:
      - '#5A6378'
    searchingActiveBorderColor:
      - '#FFB454'
    optionsTextColor:
      - '#59C2FF'
    selectedLineBgColor:
      - '#161A24'
    inactiveViewSelectedLineBgColor:
      - '#304357'
    cherryPickedCommitFgColor:
      - '#70BF56'
    cherryPickedCommitBgColor:
      - '#1D2214'
    markedBaseCommitFgColor:
      - '#59C2FF'
    markedBaseCommitBgColor:
      - '#4C4126'
    unstagedChangesColor:
      - '#F26D78'
    defaultFgColor:
      - '#BFBDB6'
  authorColors:
    '*': '#D2A6FF'
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
