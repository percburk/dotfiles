keybindings:
  back: q
  next_page: ctrl-d
  previous_page: ctrl-u
  jump_to_start: ctrl-a
  jump_to_end: ctrl-e
  jump_to_album: a
  jump_to_artist_album: A
  jump_to_context: o
  manage_devices: d
  decrease_volume: '-'
  increase_volume: +
  toggle_playback: space
  seek_backwards: <
  seek_forwards: '>'
  next_track: n
  previous_track: p
  force_previous_track: P
  help: '?'
  shuffle: ctrl-s
  repeat: ctrl-r
  search: /
  submit: enter
  copy_song_url: c
  copy_album_url: C
  audio_analysis: v
  lyrics_view: B
  miniplayer_view: T
  cover_art_view: G
  add_item_to_queue: z
  show_queue: Q
  open_settings: ctrl-,
  save_settings: alt-s
  listening_party: ctrl-p
  like_track: F
  generate_recap: R
behavior:
  seek_milliseconds: 5000
  volume_increment: 10
  volume_percent: 100
  tick_rate_milliseconds: 250
  animation_tick_rate_milliseconds: 16
  enable_text_emphasis: true
  banner_gradient: true
  show_loading_indicator: false
  enforce_wide_search_bar: false
  enable_global_song_count: true
  disable_mouse_inputs: false
  enable_discord_rpc: true
  discord_rpc_client_id: null
  enable_announcements: true
  announcement_feed_url: null
  seen_announcement_ids:
    - 2026-02-27-major-refactor-complete
    - 2026-05-19-sonos-help-wanted
  shuffle_enabled: false
  liked_icon: ♥
  shuffle_icon: 🔀
  repeat_track_icon: 🔂
  repeat_context_icon: 🔁
  playing_icon: ▶
  paused_icon: ⏸
  set_window_title: true
  visualizer_style: Equalizer
  dismissed_announcements: []
  relay_server_url: wss://spotatui-party.spotatui.workers.dev/ws
  stop_after_current_track: false
  sidebar_width_percent: 20
  playbar_height_rows: 6
  library_height_percent: 30
  startup_behavior: continue
  disable_auto_update: false
  auto_update_delay: '0'
  draw_cover_art: true
  draw_cover_art_forced: false
  playbar_cover_art_size_percent: 100
  keepawake_enabled: true
  sync_token: null
# Ayu Dark palette: https://github.com/ayu-theme/ayu-colors
theme:
  preset: Custom
  active: '89, 194, 255' # #59C2FF — current track
  banner: '89, 194, 255' # #59C2FF
  error_border: '217, 87, 87' # #D95757
  error_text: '217, 87, 87' # #D95757
  hint: '255, 180, 84' # #FFB454
  hovered: '210, 166, 255' # #D2A6FF — hovered pane
  inactive: '90, 99, 120' # #5A6378
  playbar_background: '16, 20, 28' # #10141C
  playbar_progress: '210, 166, 255' # #D2A6FF
  playbar_progress_text: '191, 189, 182' # #BFBDB6
  playbar_text: '191, 189, 182' # #BFBDB6
  selected: '230, 180, 80' # #E6B450 — active pane / LazyGit focus
  text: '191, 189, 182' # #BFBDB6
  background: Reset # Preserve the terminal's own background
  header: '89, 194, 255' # #59C2FF
  highlighted_lyrics: '149, 230, 203' # #95E6CB
