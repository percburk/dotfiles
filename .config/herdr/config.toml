onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#E6B450"
panel_bg = "reset"
surface0 = "#141821"
surface1 = "#1B1F29"
surface_dim = "#161A24"
overlay0 = "#5A6378"
overlay1 = "#6C7380"
text = "#BFBDB6"
subtext0 = "#ACB6BF"
mauve = "#D2A6FF"
green = "#70BF56"
yellow = "#FFB454"
red = "#D95757"
blue = "#59C2FF"
teal = "#39BAE6"
peach = "#FF8F40"

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true

[keys]
prefix = "alt+u"
rename_tab = ["prefix+shift+t", "prefix+comma"]
detach = ["prefix+q", "prefix+d"]
split_vertical = ["prefix+v", "prefix+backslash"]
split_horizontal = "prefix+minus"
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
