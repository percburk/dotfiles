onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
# Ayu Dark uses #475266 at 20% for selected rows and 25% for hover;
# these are the corresponding opaque composites over its #10141C sidebar.
active_row_bg = "#1B2029"
selection_bg = "#1E242F"
accent = "#E6B450"
panel_bg = "reset"
surface0 = "#141821"
surface1 = "#1B1F29"
surface_dim = "#161A24"
overlay0 = "#5A6378"
overlay1 = "#6C7380"
text = "#BFBDB6"
subtext0 = "#ACB6BF"
mauve = "#D2A6FF"
green = "#70BF56"
yellow = "#FFB454"
red = "#D95757"
blue = "#59C2FF"
teal = "#39BAE6"
peach = "#FF8F40"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
position = "top-right"

[experimental]
kitty_graphics = true

[keys]
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
rename_tab = ["prefix+comma", "prefix+shift+t"]
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "60%"
height = "60%"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"
